<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="piggyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#f0f9ff" stroke="#e0e7ff" stroke-width="2"/>
  
  <!-- Piggy bank body -->
  <ellipse cx="85" cy="100" rx="45" ry="35" fill="url(#piggyGrad)"/>
  
  <!-- Piggy bank snout -->
  <ellipse cx="45" cy="100" rx="15" ry="12" fill="#16a34a"/>
  <circle cx="40" cy="97" r="2" fill="#065f46"/>
  <circle cx="50" cy="97" r="2" fill="#065f46"/>
  
  <!-- Piggy bank ear -->
  <path d="M 70 75 Q 65 65 75 65 Q 85 65 80 75" fill="#16a34a"/>
  <path d="M 90 75 Q 85 65 95 65 Q 105 65 100 75" fill="#16a34a"/>
  
  <!-- Piggy bank eye -->
  <circle cx="65" cy="90" r="3" fill="#065f46"/>
  
  <!-- Coin slot -->
  <rect x="75" y="70" width="20" height="3" rx="1.5" fill="#065f46"/>
  
  <!-- Upward arrow -->
  <g transform="translate(130, 80)">
    <rect x="-5" y="0" width="10" height="40" fill="url(#arrowGrad)"/>
    <path d="M -15 0 L 0 -20 L 15 0 Z" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- Dollar signs floating up -->
  <text x="140" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22c55e">$</text>
  <text x="125" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e" opacity="0.7">$</text>
  <text x="145" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e" opacity="0.4">$</text>
  
  <!-- Text label -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Matched Savings
  </text>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
    Build Your Future
  </text>
</svg>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="creditGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  
  <!-- Credit score meter -->
  <g transform="translate(100, 100)">
    <!-- Outer arc -->
    <path d="M -60 0 A 60 60 0 0 1 60 0" stroke="#e5e7eb" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Progress arc -->
    <path d="M -60 0 A 60 60 0 0 1 30 -52" stroke="url(#creditGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Needle -->
    <line x1="0" y1="0" x2="35" y2="-45" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#1f2937"/>
  </g>
  
  <!-- Score labels -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">300</text>
  <text x="160" y="110" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">850</text>
  
  <!-- FICO Score -->
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#059669">740</text>
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">FICO Score</text>
  
  <!-- Plus sign and arrow -->
  <g transform="translate(130, 65)">
    <circle cx="0" cy="0" r="10" fill="#22c55e"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">+</text>
  </g>
  
  <text x="145" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e">+120</text>
  
  <!-- Smiling face -->
  <g transform="translate(100, 130)">
    <circle cx="0" cy="0" r="15" fill="#fbbf24"/>
    <circle cx="-5" cy="-3" r="2" fill="#1f2937"/>
    <circle cx="5" cy="-3" r="2" fill="#1f2937"/>
    <path d="M -8 5 Q 0 10 8 5" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text label -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#059669">
    Credit Restored
  </text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
    640+ in 6 Months
  </text>
</svg>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="32" cy="32" r="30" fill="#24B556" fill-opacity="0.1"/>
<rect x="16" y="20" width="32" height="20" rx="4" fill="#24B556" fill-opacity="0.2"/>
<path d="M20 28h24v4H20zM20 36h16v4H20z" fill="#24B556"/>
<path d="M42 18l6 6-6 6-2-2 2-2h-4v-4h4l-2-2 2-2z" fill="#24B556"/>
</svg>

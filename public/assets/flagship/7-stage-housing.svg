<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#f0f9ff" rx="10"/>
  
  <!-- Path arrow -->
  <path d="M 40 120 Q 100 80 160 120" stroke="#cbd5e1" stroke-width="4" fill="none" stroke-dasharray="5,5"/>
  <path d="M 155 115 L 160 120 L 155 125" stroke="#cbd5e1" stroke-width="4" fill="none"/>
  
  <!-- House (start) -->
  <g transform="translate(30, 100)">
    <!-- Roof -->
    <path d="M 0 15 L 20 0 L 40 15 Z" fill="url(#houseGrad)"/>
    <!-- Body -->
    <rect x="5" y="15" width="30" height="25" fill="url(#houseGrad)"/>
    <!-- Door -->
    <rect x="17" y="25" width="6" height="15" fill="#1e3a8a"/>
    <!-- Windows -->
    <rect x="10" y="20" width="5" height="5" fill="#fbbf24"/>
    <rect x="25" y="20" width="5" height="5" fill="#fbbf24"/>
  </g>
  
  <!-- Apartment building (end) -->
  <g transform="translate(140, 85)">
    <!-- Building -->
    <rect x="0" y="10" width="40" height="45" fill="url(#aptGrad)"/>
    <!-- Roof -->
    <rect x="-2" y="8" width="44" height="4" fill="#047857"/>
    <!-- Windows -->
    <rect x="5" y="15" width="6" height="6" fill="#fbbf24"/>
    <rect x="15" y="15" width="6" height="6" fill="#fbbf24"/>
    <rect x="25" y="15" width="6" height="6" fill="#fbbf24"/>
    <rect x="5" y="25" width="6" height="6" fill="#fbbf24"/>
    <rect x="15" y="25" width="6" height="6" fill="#fbbf24"/>
    <rect x="25" y="25" width="6" height="6" fill="#fbbf24"/>
    <rect x="5" y="35" width="6" height="6" fill="#fbbf24"/>
    <rect x="15" y="35" width="6" height="6" fill="#fbbf24"/>
    <rect x="25" y="35" width="6" height="6" fill="#fbbf24"/>
    <!-- Door -->
    <rect x="15" y="45" width="10" height="10" fill="#064e3b"/>
  </g>
  
  <!-- Stage numbers -->
  <circle cx="50" cy="70" r="12" fill="#e0e7ff"/>
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4338ca">1</text>
  
  <circle cx="100" cy="55" r="12" fill="#e0e7ff"/>
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4338ca">4</text>
  
  <circle cx="160" cy="65" r="12" fill="#e0e7ff"/>
  <text x="160" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4338ca">7</text>
  
  <!-- Text label -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    7-Stage Journey
  </text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
    From Intake to Legacy
  </text>
</svg>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="32" cy="32" r="30" fill="#4577F0" fill-opacity="0.1"/>
<path d="M32 12l-16 12v24h12V36h8v12h12V24L32 12z" fill="#4577F0"/>
<path d="M28 32h8v4h-8zM20 40h4v4h-4zM40 40h4v4h-4z" fill="#4577F0" fill-opacity="0.7"/>
</svg>

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f3ff" rx="10"/>
  
  <!-- Classroom setting -->
  <rect x="20" y="40" width="160" height="100" fill="#e0e7ff" rx="5"/>
  
  <!-- Whiteboard -->
  <rect x="30" y="50" width="140" height="80" fill="white" stroke="#9ca3af" stroke-width="2"/>
  
  <!-- Chart on whiteboard -->
  <g transform="translate(50, 70)">
    <!-- Axes -->
    <line x1="0" y1="50" x2="100" y2="50" stroke="#374151" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#374151" stroke-width="2"/>
    
    <!-- Bars -->
    <rect x="10" y="30" width="15" height="20" fill="#10b981"/>
    <rect x="35" y="20" width="15" height="30" fill="#3b82f6"/>
    <rect x="60" y="10" width="15" height="40" fill="#f59e0b"/>
    <rect x="85" y="5" width="15" height="45" fill="#ef4444"/>
    
    <!-- Arrow trending up -->
    <path d="M 10 35 L 40 25 L 65 15 L 95 10" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="95" cy="10" r="3" fill="#22c55e"/>
  </g>
  
  <!-- Dollar sign on board -->
  <text x="150" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#10b981">$</text>
  
  <!-- Instructor figure -->
  <g transform="translate(180, 85)">
    <circle cx="0" cy="0" r="8" fill="#8b5cf6"/>
    <circle cx="0" cy="20" r="12" fill="#8b5cf6"/>
    <!-- Pointing arm -->
    <line x1="-10" y1="20" x2="-25" y2="15" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Student desks/heads -->
  <g>
    <circle cx="50" cy="150" r="6" fill="#3b82f6"/>
    <circle cx="80" cy="152" r="6" fill="#10b981"/>
    <circle cx="110" cy="150" r="6" fill="#f59e0b"/>
    <circle cx="140" cy="152" r="6" fill="#ec4899"/>
  </g>
  
  <!-- Floating money symbols -->
  <text x="25" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22c55e" opacity="0.5">$25</text>
  <text x="160" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e" opacity="0.4">+</text>
  
  <!-- Text label -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4f46e5">
    Financial Education
  </text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
    Earn While Learning
  </text>
</svg>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="32" cy="32" r="30" fill="#24B556" fill-opacity="0.1"/>
<rect x="12" y="16" width="40" height="32" rx="2" fill="#24B556" fill-opacity="0.2"/>
<path d="M16 24h32v4H16zM16 32h24v4H16zM16 40h20v4H16z" fill="#24B556"/>
<circle cx="44" cy="20" r="4" fill="#24B556"/>
</svg>
